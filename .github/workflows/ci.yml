name: CI

# openpath の Release ワークフローは、Stable を公開すると Casks/openpath.rb を更新する PR を
# この tap に出し、auto-merge を要求する。main のルールセットで必須にする次の 2 つの job が、
# その PR をマージしてよいかを決める。job 名は openpath 側と合わせているので変えない。
#   brew audit     brew style と brew audit --cask
#   release check  scripts と workflow の unittest、cask と openpath の Release との照合

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# 同じ PR / ブランチへの連続 push では古い実行を止める
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # 明示すると -o pipefail 付きで実行され、パイプ途中の失敗も検出できる
    shell: bash

env:
  OPENPATH_REPOSITORY: TamaT-LLC/openpath

jobs:
  brew-audit:
    name: brew audit
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: brew style and brew audit --cask
        env:
          # livecheck と GitHub の audit が API の匿名の回数制限にかからないよう、読み取り専用のトークンを渡す
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: scripts/brew_audit.sh

  release-check:
    name: release check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR では merge commit の 1 番目の親（base）の cask と版を比べるため、親まで取得する
          fetch-depth: 2

      - name: Test scripts and workflow policy
        run: python3 -m unittest discover -s tests -v

      # Casks/openpath.rb が名指す版の Release を取得し、SHA256SUMS、cask の version・sha256・url、
      # Stable（draft でも prerelease でもない）であることを確かめる。cask を変えない PR でも、
      # main の cask がその Release と合っていることを毎回確かめる。
      - name: Verify Casks/openpath.rb against its openpath release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tag="$(python3 scripts/check_release.py tag --cask Casks/openpath.rb)"
          work="${RUNNER_TEMP}/openpath-release"
          mkdir -p "${work}/assets"

          gh api "repos/${OPENPATH_REPOSITORY}/releases/tags/${tag}" > "${work}/release.json"
          gh release download "${tag}" --repo "${OPENPATH_REPOSITORY}" --dir "${work}/assets" \
            --pattern openpath.rb --pattern SHA256SUMS --pattern "openpath-${tag#v}.zip"

          base_args=()
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git show "HEAD^1:Casks/openpath.rb" > "${work}/base.rb"
            base_args=(--base-cask "${work}/base.rb")
          fi
          python3 scripts/check_release.py verify --cask Casks/openpath.rb \
            --release-json "${work}/release.json" --assets "${work}/assets" "${base_args[@]}" \
            | tee "${work}/result.txt"

          {
            echo "### release check"
            echo
            echo "Casks/openpath.rb は openpath ${tag} の Stable と一致しました。"
            echo
            echo '```'
            cat "${work}/result.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify Formula/depgraph.rb against its signed public release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          base_args=()
          if [[ "${EVENT_NAME}" == "pull_request" ]] && git cat-file -e HEAD^1:Formula/depgraph.rb 2>/dev/null; then
            git show HEAD^1:Formula/depgraph.rb > "${RUNNER_TEMP}/depgraph-base.rb"
            base_args=(--base-formula "${RUNNER_TEMP}/depgraph-base.rb")
          fi
          python3 scripts/depgraph_release.py verify "${base_args[@]}"

  depgraph-install:
    name: depgraph install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test supported installations and reject Intel macOS
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          tap_dir="$(brew --repository)/Library/Taps/tamat-llc/homebrew-tap"
          test ! -e "${tap_dir}"
          mkdir -p "$(dirname "${tap_dir}")"
          ln -s "${GITHUB_WORKSPACE}" "${tap_dir}"
          if [[ "${RUNNER_OS}" == "macOS" && "${RUNNER_ARCH}" == "X64" ]]; then
            if brew install --formula tamat-llc/tap/depgraph > "${RUNNER_TEMP}/depgraph-install.log" 2>&1; then
              echo 'Intel macOS unexpectedly accepted an ARM64-only release' >&2
              exit 1
            fi
            cat "${RUNNER_TEMP}/depgraph-install.log"
            grep -Fq 'The arm64 architecture is required for this software.' "${RUNNER_TEMP}/depgraph-install.log"
          else
            brew install --formula tamat-llc/tap/depgraph
            brew test --verbose tamat-llc/tap/depgraph
          fi
